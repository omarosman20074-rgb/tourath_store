<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني - لوحة التحكم</title>
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: bold;
        }
        #admin-panel {
            display: none;
        }
    </style>
</head>
<body>

    <!-- النافبار (القائمة العلوية) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-store text-danger"></i> متجري</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">الرئيسية</a>
                    </li>
                </ul>
                <!-- زر فتح نافذة تسجيل دخول الأدمن -->
                <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#admin-login-modal">
                    <i class="fas fa-user-shield"></i> دخول الأدمن
                </button>
            </div>
        </div>
    </nav>

    <!-- المحتوى الرئيسي (عرض المنتجات) -->
    <div class="container my-5">
        <h2 class="mb-4 text-center fw-bold">منتجاتنا المتاحة</h2>
        <div class="row" id="products-container">
            <!-- سيتم تعبئة المنتجات تلقائياً عبر الجافاسكريبت -->
            <div class="col-12 text-center text-muted py-5">جاري تحميل المنتجات...</div>
        </div>
    </div>

    <!-- لوحة تحكم الأدمن (تظهر بعد تسجيل الدخول الناجح) -->
    <div class="container my-5" id="admin-panel">
        <div class="card shadow border-0 p-4 mb-5">
            <h3 class="text-danger mb-4"><i class="fas fa-gauge"></i> لوحة تحكم الأدمن</h3>
            
            <!-- قسم إضافة منتج جديد -->
            <div class="card bg-light border-0 p-3 mb-4">
                <h5 class="mb-3">إضافة منتج جديد</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="text" id="new-p-name" class="form-control" placeholder="اسم المنتج">
                    </div>
                    <div class="col-md-2">
                        <input type="number" id="new-p-price" class="form-control" placeholder="السعر">
                    </div>
                    <div class="col-md-2">
                        <input type="number" id="new-p-stock" class="form-control" placeholder="المخزون" value="5">
                    </div>
                    <div class="col-md-3">
                        <input type="file" id="new-p-file" class="form-control" accept="image/*">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-danger w-100" id="publish-product-btn" onclick="addNewProduct()">
                            <i class="fas fa-upload"></i> نشر
                        </button>
                    </div>
                    <div class="col-12">
                        <textarea id="new-p-desc" class="form-control" placeholder="وصف المنتج"></textarea>
                    </div>
                </div>
            </div>

            <!-- جدول المنتجات -->
            <h5 class="mb-3">إدارة المنتجات</h5>
            <div class="table-responsive mb-4">
                <table class="table table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>المنتج</th>
                            <th>السعر</th>
                            <th>المخزون</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-table">
                        <!-- تملئ برمجياً -->
                    </tbody>
                </table>
            </div>

            <!-- جدول الطلبات -->
            <h5 class="mb-3">طلبات العملاء</h5>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>رقم الطلب</th>
                            <th>العميل</th>
                            <th>الهاتف</th>
                            <th>الإجمالي</th>
                            <th>الحالة</th>
                            <th>التاريخ</th>
                        </tr>
                    </thead>
                    <tbody id="admin-orders-table">
                        <!-- تملئ برمجياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل دخول الأدمن (Modal) -->
    <div class="modal fade" id="admin-login-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-user-shield text-danger"></i> دخول الأدمن</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="admin-login-form">
                        <div class="mb-3">
                            <label class="form-label">البريد الإلكتروني</label>
                            <input type="email" id="admin-email" class="form-control" required value="omarosman20074@gmail.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">كلمة المرور</label>
                            <input type="password" id="admin-password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">تسجيل الدخول</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- مكتبة Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- كود الجافاسكريبت البرمجي للموقع -->
    <script>
        // إعدادات Supabase (استبدل القيم أدناه ببيانات مشروعك الفعلية)
        const SUPABASE_URL = "ضع_رابط_السูปابيس_هنا";
        const SUPABASE_ANON_KEY = "ضع_مفتاح_الانون_هنا";

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let cart = [];

        document.addEventListener("DOMContentLoaded", async () => {
            await fetchProducts();
            setupEventListeners();
        });

        async function fetchProducts() {
            try {
                const { data, error } = await db
                    .from("products")
                    .select("*")
                    .order("created_at", { ascending: false });

                if (error) throw error;
                products = data || [];
                renderProducts(products);
            } catch (err) {
                console.error("Error fetching products:", err);
            }
        }

        function renderProducts(items) {
            const container = document.getElementById("products-container");
            if (!container) return;

            if (!items.length) {
                container.innerHTML = `<div class="col-12 text-center text-muted py-5">لا توجد منتجات متاحة حالياً</div>`;
                return;
            }

            container.innerHTML = items.map(p => `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm border-0">
                        <img src="${p.image || 'https://via.placeholder.com/300'}" class="card-img-top" alt="${escapeHTML(p.name)}" style="height: 200px; object-fit: cover;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold">${escapeHTML(p.name)}</h5>
                            <p class="card-text text-muted small flex-grow-1">${escapeHTML(p.description || '')}</p>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <span class="text-danger fw-bold fs-5">${money(p.price)}</span>
                                <button class="btn btn-primary btn-sm" onclick="addToCart('${p.id}')">
                                    <i class="fas fa-cart-plus"></i> أضف للسلة
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        function setupEventListeners() {
            const loginForm = document.getElementById("admin-login-form");
            if (loginForm) {
                loginForm.addEventListener("submit", handleAdminLogin);
            }
        }

        // دالة تسجيل الدخول المخصصة بالبريد الذي طلبته
        async function handleAdminLogin(event) {
            if (event) event.preventDefault();
            
            const emailInput = document.getElementById("admin-email");
            const passwordInput = document.getElementById("admin-password");
            
            if (!emailInput || !passwordInput) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (email === "omarosman20074@gmail.com" && password === "54902007") {
                // إغلاق النافذة المنسدلة
                const modalEl = document.getElementById('admin-login-modal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();

                // إظهار لوحة التحكم
                const adminPanel = document.getElementById("admin-panel");
                if (adminPanel) {
                    adminPanel.style.display = "block";
                    adminPanel.scrollIntoView({ behavior: "smooth" });
                }

                await renderAdminProducts();
                await renderAdminOrders();
                
                alert("تم تسجيل الدخول بنجاح كأدمن!");
            } else {
                alert("بيانات الدخول غير صحيحة");
            }
        }

        async function renderAdminProducts() {
            const tbody = document.getElementById("admin-products-table");
            if (!tbody) return;

            if (!products.length) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">لا توجد منتجات</td></tr>`;
                return;
            }

            tbody.innerHTML = products.map(p => `
                <tr>
                    <td class="fw-bold">${escapeHTML(p.name)}</td>
                    <td>${money(p.price)}</td>
                    <td>
                        <input type="number" min="0" class="form-control form-control-sm" style="width: 80px;" value="${p.stock}" onchange="updateStock('${p.id}', this.value)">
                    </td>
                    <td>
                        <button class="btn btn-outline-danger btn-sm" onclick="deleteProduct('${p.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join("");
        }

        async function renderAdminOrders() {
            const tbody = document.getElementById("admin-orders-table");
            if (!tbody) return;

            const { data: orders, error } = await db
                .from("orders")
                .select("*")
                .order("created_at", { ascending: false });

            if (error || !orders || !orders.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">لا توجد طلبات حالياً</td></tr>`;
                return;
            }

            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td>#${o.id}</td>
                    <td>${escapeHTML(o.customer_name)}</td>
                    <td dir="ltr">${escapeHTML(o.customer_phone)}</td>
                    <td class="fw-bold text-danger">${money(o.total)}</td>
                    <td><span class="badge bg-secondary">${escapeHTML(o.status || "جديد")}</span></td>
                    <td>${new Date(o.created_at).toLocaleDateString("ar-EG")}</td>
                </tr>
            `).join("");
        }

        async function addNewProduct() {
            const name = document.getElementById("new-p-name").value.trim();
            const price = parseFloat(document.getElementById("new-p-price").value);
            const stock = parseInt(document.getElementById("new-p-stock").value);
            const desc = document.getElementById("new-p-desc").value.trim();
            const fileInput = document.getElementById("new-p-file");
            const btn = document.getElementById("publish-product-btn");

            if (!name || isNaN(price) || isNaN(stock)) {
                alert("من فضلك أدخل البيانات الأساسية للمنتج بشكل صحيح");
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> جاري النشر...';
            }

            try {
                let imageUrl = "";

                if (fileInput && fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const fileExt = file.name.split(".").pop();
                    const fileName = `${Date.now()}.${fileExt}`;

                    const { error: uploadError } = await db.storage
                        .from("products")
                        .upload(fileName, file);

                    if (uploadError) throw uploadError;

                    const { data: publicURLData } = db.storage
                        .from("products")
                        .getPublicUrl(fileName);

                    imageUrl = publicURLData.publicUrl;
                }

                const { error: insertError } = await db.from("products").insert([
                    { name, price, stock, description: desc, image: imageUrl }
                ]);

                if (insertError) throw insertError;

                alert("تم نشر المنتج بنجاح");
                
                document.getElementById("new-p-name").value = "";
                document.getElementById("new-p-price").value = "";
                document.getElementById("new-p-stock").value = "5";
                document.getElementById("new-p-desc").value = "";
                if (fileInput) fileInput.value = "";

                await fetchProducts();
                await renderAdminProducts();

            } catch (err) {
                console.error(err);
                alert(err.message || "حدث خطأ أثناء رفع المنتج");
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-upload"></i> نشر';
                }
            }
        }

        async function updateStock(id, newStock) {
            const stock = parseInt(newStock);
            if (isNaN(stock) || stock < 0) return;

            const { error } = await db.from("products").update({ stock }).eq("id", id);
            if (error) {
                alert("تعذر تحديث المخزون");
            } else {
                await fetchProducts();
            }
        }

        async function deleteProduct(id) {
            if (!confirm("هل أنت متأكد من حذف هذا المنتج؟")) return;

            const { error } = await db.from("products").delete().eq("id", id);
            if (error) {
                alert("تعذر حذف المنتج");
            } else {
                alert("تم حذف المنتج بنجاح");
                await fetchProducts();
                await renderAdminProducts();
            }
        }

        function money(amount) {
            return Number(amount).toFixed(2) + " ج.م";
        }

        function escapeHTML(str) {
            return str ? str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            ) : '';
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            alert("تم إضافة المنتج إلى السلة");
        }
    </script>
</body>
</html>
